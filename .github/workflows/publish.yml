name: Publish feeds

# Publishes to GitHub Pages. The schedule can start late, so the optional Cloudflare
# worker in worker/ starts runs on time and raises the alarm if publishing stops.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ github.run_id }}
          restore-keys: images-

      # Exits non-zero when too few sources respond, leaving the last good feed live.
      # A failed run emails the repo owner, which is the alert.
      - run: npm run build

      - name: Arrange the site
        run: |
          mkdir -p site/static
          cp dist/*.json site/static/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
