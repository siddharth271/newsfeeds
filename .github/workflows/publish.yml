name: Publish feeds

# Started every 15 minutes by the Cloudflare cron worker in worker/. GitHub's own
# schedule below is only a backup, because scheduled runs can start late.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ github.run_id }}
          restore-keys: images-

      # Exits non-zero when too few sources respond, leaving the last good feed live.
      # A failed run emails the repo owner, which is the alert.
      - run: npm run build

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for file in dist/*.json; do
            npx --yes wrangler@4 r2 object put "litz-feeds/$(basename "$file")" \
              --file "$file" --remote \
              --content-type application/json \
              --cache-control "public, max-age=120"
          done
